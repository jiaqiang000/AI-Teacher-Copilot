name: Sync fork with upstream

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync fork via official merge-upstream API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(gh api \
            --method POST \
            "repos/jiaqiang000/deer-flow/merge-upstream" \
            -f branch=main)
          echo "$response"
