# Teacher Copilot 配置示例(合并到 deer-flow/config.yaml 或作为独立配置参考)
#
# 本文件是增量配置片段,供实现阶段合并进 DeerFlow 主配置;不覆盖 config.example.yaml。
# 说明:Agent/Tool/Skill 通过 DeerFlow 原生配置接入(宪法 III 复用优先)。

# ===== Agent:teacher-copilot(Custom Agent)=====
agents:
  - name: teacher-copilot
    description: AI Teacher Copilot 教师主智能体
    tool_groups:
      - teacher:data
      - teacher:resource
    skills:
      - student-diagnosis
      - class-learning-analysis
      - homework-review

# ===== Tools(8 个业务 Tool,注册进 DeerFlow Tool Runtime)=====
tools:
  - name: get_student_profile
    group: teacher:data
    use: app.teacher_copilot.tools.profile:get_student_profile
  - name: get_student_grading_history
    group: teacher:data
    use: app.teacher_copilot.tools.profile:get_student_grading_history
  - name: get_class_profile
    group: teacher:data
    use: app.teacher_copilot.tools.profile:get_class_profile
  - name: list_class_students
    group: teacher:data
    use: app.teacher_copilot.tools.class_query:list_class_students
  - name: list_class_homeworks
    group: teacher:data
    use: app.teacher_copilot.tools.class_query:list_class_homeworks
  - name: get_homework_analysis
    group: teacher:data
    use: app.teacher_copilot.tools.analysis:get_homework_analysis
  - name: get_question_analysis
    group: teacher:data
    use: app.teacher_copilot.tools.analysis:get_question_analysis
  - name: search_question_bank
    group: teacher:resource
    use: app.teacher_copilot.tools.resource:search_question_bank

# ===== Sub-Agents(按需委派)=====
subagents:
  custom_agents:
    diagnosis-worker:
      description: 对分配的学生执行深度学习诊断
      system_prompt: >
        你是学习诊断子智能体,只处理分配给你的明确 student_id。
        如果一次分配多个 student_id,必须一个一个地按照 student-diagnosis SOP 独立分析:
        完成一个学生并形成该学生独立的 StudentDiagnosisResult 后,再处理下一个学生。
        不得把多个学生的 Profile、History 或诊断结论混在一起。
        不负责筛选学生或班级整体决策。
      tools:
        - get_student_profile
        - get_student_grading_history
      skills:
        - student-diagnosis
      disallowed_tools:
        - task
        - ask_clarification
        - present_files
    consistency-reviewer:
      description: 独立审核完整班级周度复盘的事实与语义一致性
      system_prompt: >
        你是班级周度复盘一致性审核子智能体。
        只检查已有 WeeklyClassReview 是否与正式 Profile、Analysis
        和学生历史证据一致,不重新生成整份周度复盘,
        不判断教学法是否最优。
      tools:
        - list_class_homeworks
        - get_class_profile
        - get_homework_analysis
        - get_student_profile
        - get_student_grading_history
      disallowed_tools:
        - task
        - ask_clarification
        - present_files

# ===== Extensions(TeacherBusinessContextMiddleware)=====
extensions:
  middlewares:
    - app.teacher_copilot.agents.middlewares.teacher_business_context:TeacherBusinessContextMiddleware

# 评测专用 Agent(eval-diagnoser):只在评测 Runner 失败/不稳定后调用
# 不进 teacher-copilot.allowed_subagents(参考文档 08 §9.3)
      eval-diagnoser:
        description: 评测失败/不稳定用例的诊断(只读,定位首个偏离轨道环节)
        system_prompt: 你是评测诊断智能体,基于 User Query/Gold Facts/Expected-Forbidden Behavior/Judge Result/EvalTraceView 定位根因(MODEL/PROMPT_SCHEMA/TOOL_DATA/AGENT_FRAMEWORK)。
        tools:
          - get_class_profile
          - get_student_profile

# ===== Memory(教师长期上下文,复用 DeerFlow Memory Runtime)=====
memory:
  mode: middleware
